<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">Block rewards high-level system design</title>
  <desc id="desc">Flowchart showing fee payment and KPI measurement feeding emission rate calculation, token issuance, and rewards distribution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #1f2020; }
    .node { fill: #1f2020; stroke: #cfcfcf; stroke-width: 1.5; rx: 6; }
    .label { fill: #d8d8d8; font-family: Arial, Helvetica, sans-serif; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; }
    .arrow { stroke: #cfcfcf; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect class="bg" width="820" height="520"/>

  <rect class="node" x="64" y="64" width="210" height="72"/>
  <text class="label" x="169" y="100">Transaction Fee Paid</text>

  <rect class="node" x="64" y="274" width="210" height="72"/>
  <text class="label" x="169" y="310">Inferred Total Stake</text>

  <rect class="node" x="64" y="382" width="210" height="72"/>
  <text class="label" x="169" y="418">Transaction Fee Pooling</text>

  <rect class="node" x="326" y="328" width="220" height="72"/>
  <text class="label" x="436" y="364">KPI Measurement</text>

  <rect class="node" x="326" y="112" width="220" height="88"/>
  <text class="label" x="436" y="144">Emission Rate</text>
  <text class="label" x="436" y="170">Factor Calculation</text>

  <rect class="node" x="64" y="166" width="210" height="72"/>
  <text class="label small" x="169" y="195">Max Annual Rate:</text>
  <text class="label small" x="169" y="217">1%</text>

  <rect class="node" x="578" y="166" width="198" height="72"/>
  <text class="label" x="677" y="202">Control Parameters</text>

  <rect class="node" x="326" y="242" width="220" height="72"/>
  <text class="label" x="436" y="278">Token Issuance</text>

  <rect class="node" x="578" y="242" width="198" height="72"/>
  <text class="label small" x="677" y="270">Block Rewards</text>
  <text class="label small" x="677" y="292">Distribution</text>

  <path class="arrow" d="M274 100 H436 V112"/>
  <path class="arrow" d="M274 202 H326"/>
  <path class="arrow" d="M578 202 H546"/>
  <path class="arrow" d="M436 328 V314"/>
  <path class="arrow" d="M436 200 V242"/>
  <path class="arrow" d="M274 310 H326"/>
  <path class="arrow" d="M274 418 H436 V400"/>
  <path class="arrow" d="M546 278 H578"/>
</svg>
